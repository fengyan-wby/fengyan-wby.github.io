<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<style>
  /* ===== 亮 / 暗两套配色（由 <script> 在渲染前根据父页面 darkmode 切换 data-mode）===== */
  :root {
    --page-bg: #faf8ef;
    --text: #776e65;
    --text-dim: #9b9184;
    --board-bg: #bbada0;
    --cell-bg: #cdc1b4;
    --box-bg: #bbada0;
    --box-label: #eee4da;
    --box-text: #ffffff;
    --btn-bg: #8f7a66;
    --btn-text: #f9f6f2;
    --overlay-bg: rgba(238, 228, 218, 0.82);
    --overlay-text: #776e65;
  }
  :root[data-mode="dark"] {
    --page-bg: #22252a;
    --text: #d8d5cf;
    --text-dim: #8b9199;
    --board-bg: #34383f;
    --cell-bg: #43484f;
    --box-bg: #34383f;
    --box-label: #b8bcc2;
    --box-text: #f0eee9;
    --btn-bg: #5a6470;
    --btn-text: #f0eee9;
    --overlay-bg: rgba(24, 26, 30, 0.82);
    --overlay-text: #e8e6e1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--page-bg);
    color: var(--text);
    font-family: "Clear Sans", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* --bw：棋盘及顶栏的统一宽度 —— 受宽度、上限、视口高度三者约束，
     保证棋盘加顶部栏/提示后总能装进 iframe 视口（iframe 由父页面按 2:3 比例给高） */
  .wrap {
    --bw: min(100%, 420px, calc(100vh - 150px));
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== 顶栏：标题 + 计分板 ===== */
  .header {
    width: var(--bw);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 {
    font-size: clamp(28px, 13vw, 40px);
    line-height: 1;
    color: var(--text);
    letter-spacing: 2px;
  }
  .scores { display: flex; gap: 8px; }
  .score-box {
    position: relative;
    min-width: 76px;
    padding: 6px 12px;
    border-radius: 8px;
    background: var(--box-bg);
    text-align: center;
  }
  .score-box .label {
    display: block;
    font-size: 11px;
    color: var(--box-label);
  }
  .score-box .value {
    display: block;
    font-size: 20px;
    font-weight: 700;
    color: var(--box-text);
  }
  /* 得分增加时的 +N 飘字 */
  .score-box .add {
    position: absolute;
    left: 0;
    right: 0;
    top: -4px;
    font-size: 18px;
    font-weight: 700;
    color: var(--overlay-text);
    animation: add-float 700ms ease forwards;
    pointer-events: none;
  }

  .subbar {
    width: var(--bw);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .subbar .subtitle {
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.4;
  }
  .btn {
    flex: none;
    padding: 8px 16px;
    border: 0;
    border-radius: 8px;
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(0.96); }

  /* ===== 棋盘 ===== */
  .board {
    position: relative;
    width: var(--bw);
    aspect-ratio: 1;
    border-radius: 10px;
    background: var(--board-bg);
    touch-action: none; /* 棋盘内禁用手势滚动，交给 JS 判定滑动方向 */
  }
  /* 16 个背景格 */
  .grid {
    position: absolute;
    inset: var(--gap, 10px);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: var(--gap, 10px);
  }
  .grid-cell { border-radius: calc(var(--cell, 60px) * 0.08); background: var(--cell-bg); }

  /* 数字方块层 */
  .tiles { position: absolute; inset: var(--gap, 10px); }

  .tile {
    position: absolute;
    width: var(--cell, 60px);
    height: var(--cell, 60px);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: calc(var(--cell, 60px) * 0.08);
    font-weight: 700;
    transition: transform 120ms ease-in-out;
  }
  /* 位数越多字号越小 */
  .tile.d1, .tile.d2 { font-size: calc(var(--cell, 60px) * 0.46); }
  .tile.d3          { font-size: calc(var(--cell, 60px) * 0.36); }
  .tile.d4          { font-size: calc(var(--cell, 60px) * 0.28); }
  .tile.d5          { font-size: calc(var(--cell, 60px) * 0.22); }

  /* 新生成的方块淡入 */
  .tile.new { animation: appear 180ms ease 60ms backwards; }
  /* 合并出的方块弹一下 */
  .tile.pop { animation: pop 180ms ease; }

  /* 经典 2048 方块配色（亮暗模式通用） */
  .v2    { background: #eee4da; color: #776e65; }
  .v4    { background: #ede0c8; color: #776e65; }
  .v8    { background: #f2b179; color: #f9f6f2; }
  .v16   { background: #f59563; color: #f9f6f2; }
  .v32   { background: #f67c5f; color: #f9f6f2; }
  .v64   { background: #f65e3b; color: #f9f6f2; }
  .v128  { background: #edcf72; color: #f9f6f2; box-shadow: 0 0 16px 0 rgba(243, 215, 116, 0.35); }
  .v256  { background: #edcc61; color: #f9f6f2; box-shadow: 0 0 16px 0 rgba(243, 215, 116, 0.45); }
  .v512  { background: #edc850; color: #f9f6f2; box-shadow: 0 0 20px 0 rgba(243, 215, 116, 0.55); }
  .v1024 { background: #edc53f; color: #f9f6f2; box-shadow: 0 0 20px 0 rgba(243, 215, 116, 0.65); }
  .v2048 { background: #edc22e; color: #f9f6f2; box-shadow: 0 0 24px 0 rgba(243, 215, 116, 0.75); }
  .vbig  { background: #3c3a32; color: #f9f6f2; }

  /* ===== 遮罩（游戏结束 / 达成 2048）===== */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    border-radius: 10px;
    background: var(--overlay-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
  }
  .overlay[hidden] { display: none; }
  .overlay .msg {
    font-size: 30px;
    font-weight: 700;
    color: var(--overlay-text);
  }
  .overlay .btn { font-size: 16px; padding: 10px 22px; }

  .hint { font-size: 12px; color: var(--text-dim); text-align: center; }

  @keyframes appear {
    from { opacity: 0; scale: 0.4; }
    to   { opacity: 1; scale: 1; }
  }
  @keyframes pop {
    0%   { scale: 1; }
    50%  { scale: 1.18; }
    100% { scale: 1; }
  }
  @keyframes add-float {
    from { opacity: 1; translate: 0 0; }
    to   { opacity: 0; translate: 0 -26px; }
  }
</style>
<script>
  // 暗色模式检测：嵌入博客时跟随父页面 body 的 .darkmode--activated 类
  // （hexo-next-darkmode 插件的实现方式，见 CLAUDE.md），独立打开时回退 prefers-color-scheme。
  // 放在 <head> 里、样式之后、首帧渲染之前执行，避免闪白。
  (function () {
    var apply = function () {
      var dark = false;
      try {
        if (window.parent && window.parent !== window && window.parent.document.body) {
          dark = window.parent.document.body.classList.contains('darkmode--activated');
        } else {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
      } catch (e) {
        dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      document.documentElement.dataset.mode = dark ? 'dark' : 'light';
    };
    apply();
    try {
      if (window.parent && window.parent !== window && window.parent.document.body) {
        new MutationObserver(apply).observe(window.parent.document.body, {
          attributes: true, attributeFilter: ['class']
        });
      }
    } catch (e) { /* 跨域时忽略 */ }
  })();
</script>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>2048</h1>
      <div class="scores">
        <div class="score-box" id="score-box">
          <span class="label">得分</span><span class="value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="label">最高</span><span class="value" id="best">0</span>
        </div>
      </div>
    </div>
    <div class="subbar">
      <p class="subtitle">合并相同的数字，冲击 2048！</p>
      <button class="btn" id="new-game">新游戏</button>
    </div>
    <div class="board" id="board">
      <div class="grid">
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      </div>
      <div class="tiles" id="tiles"></div>
      <div class="overlay" id="overlay" hidden>
        <p class="msg" id="overlay-msg"></p>
        <button class="btn" id="overlay-btn"></button>
      </div>
    </div>
    <p class="hint">方向键 / WASD 移动 &middot; 手机上滑动棋盘</p>
  </div>

<script>
(function () {
  'use strict';

  var SIZE = 4;
  var TRANSITION_MS = 120; // 与 CSS .tile 的 transition 时长一致

  var boardEl  = document.getElementById('board');
  var tilesEl  = document.getElementById('tiles');
  var scoreEl  = document.getElementById('score');
  var scoreBox = document.getElementById('score-box');
  var bestEl   = document.getElementById('best');
  var newBtn   = document.getElementById('new-game');
  var overlayEl   = document.getElementById('overlay');
  var overlayMsg  = document.getElementById('overlay-msg');
  var overlayBtn  = document.getElementById('overlay-btn');

  var grid, score, best, over, won, keepPlaying;
  var gap = 10, cellSize = 0;

  // ===== 棋盘尺寸测量：cell 尺寸写入 CSS 变量，方块位置由 JS 按 px 定位 =====
  function measure() {
    var size = boardEl.clientWidth;
    if (!size) return;
    gap = size > 320 ? 10 : 8;
    cellSize = (size - gap * 5) / 4;
    boardEl.style.setProperty('--gap', gap + 'px');
    boardEl.style.setProperty('--cell', cellSize + 'px');
    if (grid) eachTile(function (t) { placeEl(t); });
  }

  function posOf(tile) {
    return 'translate(' + (cellSize + gap) * tile.c + 'px,' + (cellSize + gap) * tile.r + 'px)';
  }
  function placeEl(tile) { tile.el.style.transform = posOf(tile); }

  function eachTile(fn) {
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (grid[r][c]) fn(grid[r][c]);
  }

  // ===== 方块 DOM =====
  function tileClass(v) {
    var d = String(v).length;
    return 'tile ' + (v > 2048 ? 'vbig' : 'v' + v) + ' d' + d;
  }
  function makeEl(tile, extra) {
    var el = document.createElement('div');
    el.className = tileClass(tile.value) + (extra ? ' ' + extra : '');
    el.textContent = tile.value;
    el.style.transform = posOf(tile); // 此刻 tile.el 尚未赋值，直接设置元素
    tilesEl.appendChild(el);
    return el;
  }
  function updateEl(tile, extra) {
    tile.el.className = tileClass(tile.value) + (extra ? ' ' + extra : '');
    tile.el.textContent = tile.value;
  }
  function popEl(tile) {
    tile.el.classList.remove('pop');
    void tile.el.offsetWidth; // 强制重排以重启动画
    tile.el.classList.add('pop');
  }

  function createTile(r, c, value) {
    var tile = { r: r, c: c, value: value, merged: false };
    tile.el = makeEl(tile, 'new');
    grid[r][c] = tile;
    return tile;
  }

  function spawn() {
    var empty = [];
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (!grid[r][c]) empty.push([r, c]);
    if (!empty.length) return;
    var p = empty[Math.floor(Math.random() * empty.length)];
    createTile(p[0], p[1], Math.random() < 0.9 ? 2 : 4);
  }

  // ===== 计分 =====
  function loadBest() { try { best = +localStorage.getItem('blog2048-best') || 0; } catch (e) { best = 0; } }
  function saveBest() { try { localStorage.setItem('blog2048-best', best); } catch (e) { /* 隐私模式等场景忽略 */ } }

  function addScore(gained) {
    score += gained;
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; saveBest(); }
    if (gained <= 0) return; // 无合并时不飘 "+0"
    var add = document.createElement('span');
    add.className = 'add';
    add.textContent = '+' + gained;
    scoreBox.appendChild(add);
    add.addEventListener('animationend', function () { add.remove(); });
  }

  // ===== 核心移动逻辑 =====
  // dr/dc 为方向向量：上(-1,0) 下(1,0) 左(0,-1) 右(0,1)
  function move(dr, dc) {
    if (over) return;
    eachTile(function (t) { t.merged = false; });

    var rows = [0, 1, 2, 3], cols = [0, 1, 2, 3];
    if (dr === 1) rows.reverse();
    if (dc === 1) cols.reverse();

    var moved = false, gained = 0, made2048 = false;

    for (var i = 0; i < SIZE; i++) {
      for (var j = 0; j < SIZE; j++) {
        var r = rows[i], c = cols[j];
        var tile = grid[r][c];
        if (!tile) continue;

        // 沿方向找最远可达的空格
        var nr = r, nc = c;
        while (true) {
          var tr = nr + dr, tc = nc + dc;
          if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE || grid[tr][tc]) break;
          nr = tr; nc = tc;
        }
        var ar = nr + dr, ac = nc + dc; // 再往前一格（若在界内且非空，即碰撞对象）
        var ahead = (ar >= 0 && ar < SIZE && ac >= 0 && ac < SIZE) ? grid[ar][ac] : null;

        if (ahead && ahead.value === tile.value && !ahead.merged) {
          // 合并：逻辑上立即翻倍，视觉上滑动到位后再更新数字并弹跳
          grid[r][c] = null;
          ahead.value *= 2;
          ahead.merged = true;
          gained += ahead.value;
          if (ahead.value === 2048 && !won) made2048 = true;

          tile.r = ar; tile.c = ac;
          placeEl(tile);
          (function (target, dyingEl) {
            setTimeout(function () {
              updateEl(target);
              popEl(target);
              dyingEl.remove();
            }, TRANSITION_MS);
          })(ahead, tile.el);
          moved = true;
        } else if (nr !== r || nc !== c) {
          // 纯移动
          grid[r][c] = null;
          grid[nr][nc] = tile;
          tile.r = nr; tile.c = nc;
          placeEl(tile);
          moved = true;
        }
      }
    }

    if (!moved) return;

    addScore(gained);
    spawn();

    if (made2048 && !keepPlaying) {
      won = true;
      setTimeout(function () { showOverlay('🎉 达成 2048！', '继续挑战', function () { hideOverlay(); keepPlaying = true; }); }, 300);
    } else if (!movesAvailable()) {
      setTimeout(function () { over = true; showOverlay('游戏结束！', '再玩一次', newGame); }, 300);
    }
  }

  function movesAvailable() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var t = grid[r][c];
        if (!t) return true;
        if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].value === t.value) return true;
        if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].value === t.value) return true;
      }
    }
    return false;
  }

  // ===== 遮罩 =====
  function showOverlay(msg, btnText, onBtn) {
    overlayMsg.textContent = msg;
    overlayBtn.textContent = btnText;
    overlayBtn.onclick = onBtn;
    overlayEl.hidden = false;
  }
  function hideOverlay() { overlayEl.hidden = true; }

  // ===== 新游戏 =====
  function newGame() {
    tilesEl.innerHTML = '';
    grid = [[null, null, null, null], [null, null, null, null], [null, null, null, null], [null, null, null, null]];
    score = 0; over = false; won = false; keepPlaying = false;
    scoreEl.textContent = 0;
    hideOverlay();
    spawn();
    spawn();
  }

  // ===== 输入：键盘 =====
  var KEYS = {
    ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1],
    w: [-1, 0], s: [1, 0], a: [0, -1], d: [0, 1]
  };
  window.addEventListener('keydown', function (e) {
    var key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    var v = KEYS[key];
    if (v) { e.preventDefault(); move(v[0], v[1]); }
  });

  // ===== 输入：触屏滑动 =====
  var touchX = 0, touchY = 0, tracking = false;
  boardEl.addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    touchX = t.clientX; touchY = t.clientY; tracking = true;
  }, { passive: true });
  boardEl.addEventListener('touchmove', function (e) {
    if (tracking) e.preventDefault(); // 滑动棋盘时不让页面跟着滚
  }, { passive: false });
  boardEl.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchX, dy = t.clientY - touchY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1);
    else move(dy > 0 ? 1 : -1, 0);
  });

  newBtn.addEventListener('click', newGame);

  // ===== 启动 =====
  loadBest();
  bestEl.textContent = best;
  measure();
  if (window.ResizeObserver) new ResizeObserver(measure).observe(boardEl);
  window.addEventListener('resize', measure);
  newGame();
})();
</script>
</body>
</html>
